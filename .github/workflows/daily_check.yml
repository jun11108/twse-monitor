name: TWSE Margin Ratio Daily Monitor

on:
  schedule:
    # UTC 23:00 (週日至週五) = 台灣時間 週一至週六 每天早上 07:00 自動執行
    - cron: '0 23 * * 0-5'
  workflow_dispatch: # 支援隨時手動一鍵測試

jobs:
  check_margin:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright yfinance requests
          playwright install chromium

      - name: Run Monitor & Send Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: "junn11108@gmail.com"
        run: python monitor.py
