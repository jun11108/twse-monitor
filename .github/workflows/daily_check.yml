name: TWSE Margin Ratio Daily Monitor

on:
  schedule:
    # UTC 23:00 (週日至週五) = 台灣時間 週一至週六 每天早上 07:00 自動執行
    - cron: '0 23 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_margin:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright yfinance requests
          playwright install chromium

      - name: Run Monitor, Generate JSON & Send Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: "jun11108@cht.com.tw"
        run: python monitor.py

      - name: Auto-Commit latest.json for Web Dashboard
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add data/latest.json
          git diff --staged --quiet || git commit -m "Auto update daily strategy data"
          git push
